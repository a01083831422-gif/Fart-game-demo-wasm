<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity Web Player | Fart Together Demo</title>
    <!-- Three.js & Post-Processing (Local High-Performance Engine) -->
    <script src="assets/js/three.min.js"></script>
    <script src="assets/js/CopyShader.js"></script>
    <script src="assets/js/LuminosityHighPassShader.js"></script>
    <script src="assets/js/ShaderPass.js"></script>
    <script src="assets/js/RenderPass.js"></script>
    <script src="assets/js/EffectComposer.js"></script>
    <script src="assets/js/UnrealBloomPass.js"></script>
  </head>
  <body style="text-align: center; padding: 0; border: 0; margin: 0; overflow: hidden; background: #000000;">
    <canvas id="unity-canvas" width="1920" height="1080" tabindex="-1" style="width: 100vw; height: 100vh; display: block; background: #080c14;"></canvas>
    <script src="Build/FartTogether.loader.js"></script>
    <script>
      createUnityInstance(document.querySelector("#unity-canvas"), {
        arguments: [],
        dataUrl: "Build/FartTogether.data",
        frameworkUrl: "Build/FartTogether.framework.js",
        codeUrl: "Build/FartTogether_Engine_part01.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "PuffPirates",
        productName: "Fart Together Demo",
        productVersion: "0.0.1"
      }).catch((message) => {
        console.error(message);
      });
    </script>
  </body>
</html>
